<html>
  <head>
    <style>
      html {
        font-family: sans-serif;
        /* background-color: #0b1e39; */
        background: transparent;
        overflow: hidden;
      }

      body {
        /* background-color: #0b1e39; */
        background: transparent;
        overflow: hidden;
      }

      button {
        border-radius: 12px;
        background-color: #10366b;
        padding: 6px;
        color: white;
        border-width: 2px;
        border-color: white;
      }

      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      *[data-wry-darg-region] {
        app-region: drag; /* Supported on Windows only, on WebView2 123+ and makes dragging with touch work */
      }

      main {
        display: grid;
        place-items: center;
        /* height: calc(100vh); */
        margin-top: 0px;
        padding-left: 6px;
        padding-right: 6px;
        /* background-color: white; */
        background-color: #0b1e39;
        color: white;
        border-radius: 12px;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <main>
      !REPLACEBODY!
    </main>
    <script>
      document.addEventListener("mousemove", (e) => {
        window.ipc.postMessage(`input!mousemove:${e.clientX},${e.clientY}`)
      });
      document.addEventListener("mousedown", (e) => {
        if (e.target.hasAttribute("data-wry-darg-region") && e.button === 0) {
          e.detail === 2
            ? window.ipc.postMessage("input!maximize")
            : window.ipc.postMessage("input!drag_window");
        } else {
          window.ipc.postMessage(`input!mousedown:${e.clientX},${e.clientY}`);
        }
      });
      document.addEventListener("touchstart", (e) => {
        if (e.target.hasAttribute("data-wry-darg-region")) {
          window.ipc.postMessage("input!drag_window");
        }
      });
    </script>
  </body>
</html>
